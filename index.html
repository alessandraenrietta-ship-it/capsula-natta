<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TESTO MODIFICABILE: titolo della scheda del browser e descrizione
       che compare su Google e nelle anteprime quando si condivide il
       link. Stanno qui e non in contenuti/ perché devono esserci prima
       che la pagina legga i file di testo. -->
  <title>Vent'anni di Natta | IIS Giulio Natta, Rivoli</title>
  <meta name="description" content="Il ventennale dell'IIS Giulio Natta di Rivoli (2006–2026) e la capsula del tempo custodita per dieci anni sotto il pero della scuola.">

  <!-- BOZZA: chiede ai motori di ricerca di non mostrare questa pagina
       e di non seguirne i link. Va TOLTA quando il sito è approvato. -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Il numero dopo ?v= serve a far riscaricare il file quando cambia.
    Senza, il browser continua a usare per qualche minuto la copia
    vecchia e le modifiche non si vedono.
    QUANDO SI MODIFICA UN FILE .css O .js, SI AUMENTA IL NUMERO DI UNO
    in tutte le pagine che lo caricano.
  -->
  <link rel="stylesheet" href="grafica.css?v=6">
  <link rel="icon" href="immagini/logo-natta.png">
</head>
<body>

  <a class="salta" href="#contenuto">Salta al contenuto</a>

  <!-- La testata: logo e nome della scuola, su fondo bianco -->
  <header class="testata">
    <div class="interno">
      <p class="marchio">
        <!-- alt vuoto: il nome della scuola è scritto subito accanto -->
        <img class="logo-scuola" src="immagini/logo-natta.png" alt="" width="231" height="155">
        <span id="nome-scuola"></span>
      </p>
    </div>
  </header>

  <!-- Tutti i testi qui sotto arrivano dai file della cartella
       contenuti/: home.txt, comuni.txt, foto-pero.txt ed eventi.txt. Il contenuto resta nascosto
       finché i testi non sono stati letti, così non si vedono titoli
       vuoti. -->
  <main id="contenuto" tabindex="-1" hidden>

    <!-- Apertura: occhiello, titolo, conto alla rovescia e pulsanti.
         Senza disegno: il pero sta nella sezione dopo. -->
    <section class="sezione apertura" aria-labelledby="titolo">
      <div class="interno">
        <p class="occhiello" id="occhiello"></p>
        <h1 class="titolo-sito" id="titolo"></h1>
        <!-- Il conto alla rovescia lo scrive js/home.js e cambia con le
             tre fasi: prima dell'interramento, dopo l'interramento, dopo
             l'apertura. -->
        <div class="conto" id="conto"></div>
        <!-- I pulsanti compaiono solo se la loro pagina è "pronta" -->
        <p class="pulsanti" id="pulsanti" hidden></p>
      </div>
    </section>

    <!-- "10 anni di Peropezie": il palco con il disegno del pero e, sotto,
         la fila delle foto. Toccando una foto, la foto prende il posto
         del disegno. Lo riempie js/peropezie.js, con i testi di home.txt
         e le foto di foto-pero.txt. -->
    <section class="sezione peropezie" aria-labelledby="titolo-peropezie">
      <div class="interno">
        <h2 class="titolo-sezione" id="titolo-peropezie"></h2>
        <p class="sezione-riga" id="riga-peropezie"></p>

        <div class="palco">
          <!-- Il disegno del pero, letto da immagini/pero-capsula.svg. È
               solo decorativo: nascosto ai lettori di schermo. -->
          <div class="palco-scena palco-pero" id="palco-pero" aria-hidden="true"></div>
          <!-- La foto scelta, al posto del disegno -->
          <figure class="palco-scena palco-foto" id="palco-foto" hidden>
            <img id="palco-immagine" src="" alt="">
          </figure>
        </div>
        <div class="palco-sotto" id="palco-sotto" hidden>
          <p class="palco-data" id="palco-data"></p>
          <p class="palco-credito" id="palco-credito"></p>
          <p><button type="button" class="pulsante pulsante-vuoto" id="torna-al-pero"></button></p>
        </div>

        <!-- La fila delle foto piccole, dalla più recente, con le due
             frecce. Compare solo se ci sono foto. -->
        <div class="fila-foto" id="fila-foto" hidden>
          <button type="button" class="freccia freccia-indietro" id="freccia-indietro"></button>
          <ul class="miniature" id="miniature"></ul>
          <button type="button" class="freccia freccia-avanti" id="freccia-avanti"></button>
        </div>

        <!-- Per il lettore di schermo: dice che cosa c'è nel palco dopo
             ogni cambio -->
        <p class="solo-lettori" id="annuncio-palco" aria-live="polite"></p>
      </div>
    </section>

    <!-- "Gli eventi del ventennale": per ogni evento il foglietto della
         data, il titolo e sotto ora, luogo e relatore. Gli eventi
         passati spariscono da soli; la sezione si vede solo prima
         dell'interramento. La riempie js/home.js con eventi.txt. -->
    <section class="sezione" id="sezione-eventi" aria-labelledby="titolo-eventi" hidden>
      <div class="interno">
        <h2 class="titolo-sezione titolo-centrato" id="titolo-eventi"></h2>
        <ul class="date" id="elenco-eventi"></ul>
      </div>
    </section>

  </main>

  <!-- TESTO MODIFICABILE: compare solo se i file di testo non si
       possono leggere. -->
  <section class="sezione" id="avviso" hidden>
    <div class="interno">
      <h1 class="titolo-sezione">Vent'anni di Natta</h1>
      <p>Non riesco a caricare i testi di questa pagina.</p>
      <p>Se hai aperto il file dal computer con un doppio clic, usa invece
         anteprima.bat. Altrimenti ricarica la pagina, oppure
         visita il <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
    </div>
  </section>

  <!-- Se JavaScript è spento, la pagina non può leggere i testi -->
  <noscript>
    <section class="sezione">
      <div class="interno">
        <p>Per vedere questa pagina serve JavaScript attivo nel browser.
           In alternativa visita il
           <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
      </div>
    </section>
  </noscript>

  <!-- Il piede: il timbro rotondo e, accanto, il link al kit per i
       docenti (solo quando la pagina c'è, e solo prima
       dell'interramento) -->
  <footer class="piede">
    <div class="interno piede-interno">
      <!-- Il timbro lo disegna js/comuni.js. È solo decorativo. -->
      <div class="timbro" id="timbro" aria-hidden="true"></div>
      <ul class="piede-voci" id="piede" hidden></ul>
    </div>
  </footer>

  <script src="js/contenuti.js?v=1"></script>
  <script src="js/comuni.js?v=4"></script>
  <script src="js/home.js?v=3"></script>
  <script src="js/peropezie.js?v=2"></script>
</body>
</html>
