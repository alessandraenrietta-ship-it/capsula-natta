  <!-- Disegno del pero, versione definitiva (28/10/2026): chioma a nuvola, base sinuosa, terreno formato dalle linee.
       linea-1 e linea-2: terreno, tronco e chioma; ognuna è divisa in due metà (sinistra e destra) che si incontrano in cima alla chioma.
       Animazione: le due metà partono insieme dai bordi; linea-2 mezzo secondo dopo linea-1; poi linea-3 (chioma interna e capsula); infine le righette.
       Le righette (gruppi laterali del polipropilene di Giulio Natta) stanno solo nella parte alta della chioma.
       Al computer i tratti del terreno si allungano fino ai bordi della finestra. -->
