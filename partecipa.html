<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TESTO MODIFICABILE: titolo della scheda del browser e descrizione
       per i motori di ricerca. Stanno qui e non in contenuti/ perché
       devono esserci prima che la pagina legga i file di testo. -->
  <title>Partecipa | Vent'anni di Natta</title>
  <meta name="description" content="Partecipa alla capsula del tempo del ventennale dell'IIS Giulio Natta di Rivoli: il questionario per gli studenti e il dizionario del presente, con l'account della scuola.">

  <!-- BOZZA: chiede ai motori di ricerca di non mostrare questa pagina
       e di non seguirne i link. Va TOLTA quando il sito è approvato. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- QUANDO SI MODIFICA UN FILE .css O .js, SI AUMENTA IL NUMERO DI UNO
       dopo ?v= in tutte le pagine che lo caricano. -->
  <link rel="stylesheet" href="grafica.css?v=10">
  <link rel="icon" href="immagini/logo-natta.png">
</head>
<body data-pagina="partecipa">

  <a class="salta" href="#contenuto">Salta al contenuto</a>

  <!-- La testata, come nella home: qui logo e nome portano alla home -->
  <header class="testata">
    <div class="interno testata-interno">
      <a class="marchio" href="index.html">
        <!-- alt vuoto: il nome della scuola è scritto subito accanto -->
        <img class="logo-scuola" src="immagini/logo-natta.png" alt="" width="231" height="155">
        <span id="nome-scuola"></span>
      </a>
      <nav class="menu" id="menu" hidden>
        <button type="button" class="pulsante pulsante-vuoto menu-pulsante" id="menu-pulsante" aria-expanded="false" aria-controls="menu-lista"></button>
        <ul class="menu-lista" id="menu-lista"></ul>
      </nav>
    </div>
  </header>

  <!-- Tutti i testi qui sotto arrivano da contenuti/partecipa.txt. Il
       sito non riceve nulla: ci sono solo i link (e i codici QR) ai
       Google Moduli della scuola. -->
  <main id="contenuto" tabindex="-1" hidden>

    <section class="sezione apertura" aria-labelledby="titolo">
      <div class="interno">
        <h1 class="titolo-sito titolo-pagina" id="titolo"></h1>
        <div class="presentazione" id="testo-apertura"></div>
        <p class="avviso-account" id="avviso-account"></p>
      </div>
    </section>

    <!-- Un modulo: titolo, riga e, quando c'è il link, pulsante e QR -->
    <section class="sezione modulo" aria-labelledby="titolo-studenti">
      <div class="interno">
        <h2 class="titolo-sezione titolo-centrato" id="titolo-studenti"></h2>
        <div class="presentazione" id="testo-studenti"></div>
        <div class="modulo-link" id="link-studenti"></div>
      </div>
    </section>

    <section class="sezione modulo" aria-labelledby="titolo-dizionario">
      <div class="interno">
        <h2 class="titolo-sezione titolo-centrato" id="titolo-dizionario"></h2>
        <div class="presentazione" id="testo-dizionario"></div>
        <div class="modulo-link" id="link-dizionario"></div>
      </div>
    </section>

    <!-- Per i docenti: niente link e niente password, il questionario
         arriva via mail istituzionale -->
    <section class="sezione modulo" aria-labelledby="titolo-docenti">
      <div class="interno">
        <h2 class="titolo-sezione titolo-centrato" id="titolo-docenti"></h2>
        <div class="presentazione" id="testo-docenti"></div>
      </div>
    </section>

  </main>

  <!-- TESTO MODIFICABILE: compare solo se i file di testo non si
       possono leggere. -->
  <section class="sezione" id="avviso" hidden>
    <div class="interno">
      <h1 class="titolo-sezione">Partecipa</h1>
      <p>Non riesco a caricare i testi di questa pagina.</p>
      <p>Se hai aperto il file dal computer con un doppio clic, usa invece
         anteprima.bat. Altrimenti ricarica la pagina, oppure
         visita il <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
    </div>
  </section>

  <noscript>
    <section class="sezione">
      <div class="interno">
        <p>Per vedere questa pagina serve JavaScript attivo nel browser.
           In alternativa visita il
           <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
      </div>
    </section>
  </noscript>

  <!-- Il piede, come nella home -->
  <footer class="piede">
    <div class="interno piede-interno">
      <div class="timbro" id="timbro" aria-hidden="true"></div>
      <ul class="piede-voci" id="piede" hidden></ul>
    </div>
  </footer>

  <script src="js/contenuti.js?v=1"></script>
  <script src="js/comuni.js?v=8"></script>
  <script src="js/qr.js?v=1"></script>
  <script src="js/partecipa.js?v=3"></script>
</body>
</html>
